services:
  - type: web
    name: studentwellbeing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_BASE_URL
        value: https://studentwellbeing.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: studentwellbeing-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: AGENT_MODEL
        value: deepseek-chat

databases:
  - name: studentwellbeing-db
    plan: free
    databaseName: studentwellbeing
    user: studentwellbeing