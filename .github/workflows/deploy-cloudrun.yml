name: Build and deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: studentwellbeing
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${IMAGE_TAG}"
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "cloud-run-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest" \
            --set-env-vars "APP_ENV=production,DEBUG=false,DEEPSEEK_BASE_URL=https://api.deepseek.com,AGENT_MODEL=deepseek-chat"

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${REGION}" \
            --format="value(status.url)"
