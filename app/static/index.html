<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Student Well-Being Support System</title>
<style>
  :root {
    --blue: #1a3aad; --blue-dark: #1e3a8a; --teal: #0d9488;
    --bg: #f1f5f9; --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
    --high: #dc2626; --high-bg: #fef2f2; --mod: #d97706; --mod-bg: #fffbeb; --low: #16a34a; --low-bg: #f0fdf4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  a { color: inherit; }

  #sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 240px; background: var(--blue-dark); color: #fff; display: flex; flex-direction: column; padding: 20px 0; }
  #sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 12px; }
  .logo-badge { width: 34px; height: 34px; border-radius: 50%; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
  .nav-group-label { padding: 14px 20px 6px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); }
  .nav-item { display: block; padding: 10px 20px; font-size: 0.9rem; color: rgba(255,255,255,0.85); cursor: pointer; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.08); }
  .nav-item.active { background: rgba(255,255,255,0.14); border-left-color: var(--teal); font-weight: 600; }
  #sidebar .footer { margin-top: auto; padding: 14px 20px; font-size: 0.7rem; color: rgba(255,255,255,0.45); }

  #main { margin-left: 240px; min-height: 100vh; }
  #topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  #topbar .status { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
  #topbar .right { display: flex; align-items: center; gap: 16px; }
  select#langSelect { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: #fff; }
  #content { padding: 28px; }

  h1.page-title { font-size: 1.4rem; margin: 0 0 20px; color: var(--blue-dark); }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .kpi { text-align: center; }
  .kpi .value { font-size: 1.8rem; font-weight: 700; color: var(--blue-dark); }
  .kpi .label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f8fafc; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .badge.high, .badge.escalated { background: var(--high-bg); color: var(--high); }
  .badge.moderate { background: var(--mod-bg); color: var(--mod); }
  .badge.low, .badge.active, .badge.acknowledged { background: var(--low-bg); color: var(--low); }
  .badge.completed, .badge.pending { background: #f1f5f9; color: var(--muted); }

  .btn { border: none; border-radius: 8px; padding: 9px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: #0b7c72; }
  .btn-outline { background: #fff; border: 1px solid var(--blue); color: var(--blue); }
  .btn-outline:hover { background: #eef2ff; }
  .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: none; align-items: center; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 26px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 16px; color: var(--blue-dark); }
  .modal .close-btn { float: right; background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--muted); }

  .disclaimer { font-style: italic; font-size: 0.78rem; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 14px; font-size: 0.85rem; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand"><span class="logo-badge">KPM</span> <span data-i18n="app.title">SWEEB</span></div>
  <div class="nav-group-label">Overview</div>
  <div class="nav-item" data-page="dashboard" data-i18n="nav.dashboard">Dashboard</div>
  <div class="nav-group-label">Students</div>
  <div class="nav-item" data-page="students" data-i18n="nav.students">All Students</div>
  <div class="nav-group-label">AI Agents</div>
  <div class="nav-item" data-page="early_detection" data-i18n="nav.early_detection">Early Detection</div>
  <div class="nav-item" data-page="intervention" data-i18n="nav.intervention">Intervention</div>
  <div class="nav-item" data-page="referral" data-i18n="nav.referral">Referral</div>
  <div class="nav-item" data-page="reporting" data-i18n="nav.reporting">Reporting</div>
  <div class="nav-group-label">Tools</div>
  <div class="nav-item" data-page="assessments" data-i18n="nav.assessments">Assessment Instruments</div>
  <div class="nav-item" data-page="class_summary" data-i18n="nav.class_summary">Class Summary</div>
  <div class="nav-group-label">System</div>
  <div class="nav-item" data-page="api_docs" data-i18n="nav.api_docs">API Docs</div>
  <div class="footer">v1.0.0 · MoE 2027 Aligned<br/>PDPA Compliant</div>
</div>

<div id="main">
  <div id="topbar">
    <div class="status"><span class="status-dot"></span> <span>System Online</span></div>
    <div class="right">
      <select id="langSelect"></select>
      <span id="userInfo" class="muted"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()" data-i18n="common.logout">Logout</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
const STORAGE_KEY = 'swb_auth';
const auth = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
if (!auth) window.location.replace('/');

const S = { page: 'dashboard', studentId: null };
let TRANSLATIONS = {};

// ── apiFetch: attaches the JWT automatically; the old project's frontend
// never sent an identity on guarded routes at all — this fixes that. ──
async function apiFetch(path, opts = {}) {
  const headers = Object.assign({ 'Authorization': `Bearer ${auth.access_token}` }, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    sessionStorage.removeItem(STORAGE_KEY);
    window.location.replace('/');
    throw new Error('Session expired');
  }
  return res;
}

function logout() {
  sessionStorage.removeItem(STORAGE_KEY);
  window.location.replace('/');
}

function t(key, fallback) { return TRANSLATIONS[key] || fallback || key; }

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (TRANSLATIONS[el.getAttribute('data-i18n')]) el.textContent = TRANSLATIONS[el.getAttribute('data-i18n')];
  });
}

async function loadLanguages() {
  const langSelect = document.getElementById('langSelect');
  const res = await fetch('/i18n/languages');
  const languages = await res.json();
  langSelect.innerHTML = languages.map(l => `<option value="${l.code}">${l.native_name}</option>`).join('');
  const saved = auth.user.preferred_language_code || localStorage.getItem('swb_lang') || languages.find(l => l.is_default)?.code || 'ms';
  langSelect.value = saved;
  await loadTranslations(saved);
  langSelect.addEventListener('change', async () => {
    localStorage.setItem('swb_lang', langSelect.value);
    await loadTranslations(langSelect.value);
    await apiFetch('/auth/me/language', { method: 'PATCH', body: JSON.stringify({ language_code: langSelect.value }) });
    renderPage();
  });
}

async function loadTranslations(code) {
  const res = await fetch(`/i18n/translations?lang=${code}`);
  TRANSLATIONS = await res.json();
  applyTranslations();
}

function currentLang() { return document.getElementById('langSelect').value; }

function riskBadgeClass(level) {
  if (!level) return '';
  const l = level.toLowerCase();
  if (l.includes('high')) return 'high';
  if (l.includes('moderate')) return 'moderate';
  return 'low';
}

function openModal(html) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function navigate(page, studentId) {
  S.page = page;
  if (studentId !== undefined) S.studentId = studentId;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  renderPage();
}
document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => navigate(el.dataset.page)));

async function renderPage() {
  const content = document.getElementById('content');
  content.innerHTML = '<p class="muted">' + t('common.loading', 'Loading...') + '</p>';
  try {
    if (S.page === 'dashboard') return renderDashboard();
    if (S.page === 'students') return renderStudents();
    if (S.page === 'student_detail') return renderStudentDetail();
    if (S.page === 'early_detection') return renderEarlyDetection();
    if (S.page === 'intervention') return renderIntervention();
    if (S.page === 'referral') return renderReferral();
    if (S.page === 'reporting') return renderDashboard();
    if (S.page === 'assessments') return renderAssessments();
    if (S.page === 'class_summary') return renderClassSummary();
    if (S.page === 'api_docs') { window.open('/docs', '_blank'); navigate('dashboard'); return; }
  } catch (err) {
    content.innerHTML = `<p style="color:#dc2626">${err.message}</p>`;
  }
}

// ── Dashboard ──
async function renderDashboard() {
  const res = await apiFetch('/reports/dashboard');
  const content = document.getElementById('content');
  if (!res.ok) { content.innerHTML = await errorHtml(res); return; }
  const d = await res.json();
  content.innerHTML = `
    <h1 class="page-title">${t('dashboard.title', 'Dashboard Overview')} — ${d.period}</h1>
    <div class="grid">
      <div class="card kpi"><div class="value">${d.school_kpis.total_students}</div><div class="label">${t('dashboard.total_students', 'Total Students')}</div></div>
      <div class="card kpi"><div class="value">${d.school_kpis.active_interventions}</div><div class="label">${t('dashboard.active_interventions', 'Active Interventions')}</div></div>
      <div class="card kpi"><div class="value">${d.school_kpis.referrals_made}</div><div class="label">${t('dashboard.referrals_made', 'Referrals Made')}</div></div>
      <div class="card kpi"><div class="value">${d.school_kpis.referrals_acknowledged}</div><div class="label">${t('dashboard.referrals_acknowledged', 'Referrals Acknowledged')}</div></div>
    </div>
    <div class="card">
      <h3>${t('nav.class_summary', 'Class Breakdown')}</h3>
      <table><thead><tr><th>Class</th><th>Total</th><th>${t('risk.low','Low')}</th><th>${t('risk.moderate','Moderate')}</th><th>${t('risk.high','High')}</th></tr></thead>
      <tbody>${d.class_breakdown.map(c => `<tr><td>${c.class_name}</td><td>${c.total_students}</td><td>${c.low_risk}</td><td>${c.moderate_risk}</td><td>${c.high_risk}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No data yet.</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Trend Analysis</h3><p>${d.trend_analysis}</p>
      <h3>Management Summary</h3><p>${d.management_summary}</p>
      <h3>Recommendations</h3><ul>${d.recommendations.map(r => `<li>${r}</li>`).join('')}</ul>
      <div class="disclaimer">${d.disclaimer}</div>
    </div>`;
}

// ── Students ──
async function renderStudents() {
  const res = await apiFetch('/students/');
  const content = document.getElementById('content');
  if (!res.ok) { content.innerHTML = await errorHtml(res); return; }
  const students = await res.json();
  content.innerHTML = `
    <div class="toolbar">
      <h1 class="page-title" style="margin:0">${t('nav.students', 'All Students')}</h1>
      <button class="btn btn-primary" onclick="openAddStudentModal()">${t('students.add_new', 'Add New Student')}</button>
    </div>
    <div class="card">
      <table><thead><tr><th>ID</th><th>${t('students.full_name','Name')}</th><th>${t('students.class_name','Class')}</th><th>${t('students.school_year','Year')}</th></tr></thead>
      <tbody>${students.map(s => `<tr class="clickable" onclick="navigate('student_detail', '${s.student_id}')"><td>${s.student_id}</td><td>${s.full_name}</td><td>${s.class_name}</td><td>${s.school_year}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No students yet.</td></tr>'}</tbody></table>
    </div>`;
}

function openAddStudentModal() {
  openModal(`
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3>${t('students.add_new', 'Add New Student')}</h3>
    <form onsubmit="return submitAddStudent(event)">
      <div class="form-grid">
        <div class="field"><label>Student ID</label><input id="f_student_id" required /></div>
        <div class="field"><label>${t('students.full_name','Full Name')}</label><input id="f_full_name" required /></div>
        <div class="field"><label>Date of Birth</label><input type="date" id="f_dob" required /></div>
        <div class="field"><label>Gender</label><select id="f_gender"><option>Male</option><option>Female</option></select></div>
        <div class="field"><label>${t('students.class_name','Class')}</label><input id="f_class" required /></div>
        <div class="field"><label>${t('students.school_year','School Year')}</label><input type="number" id="f_year" value="${new Date().getFullYear()}" required /></div>
        <div class="field"><label>School ID</label><input type="number" id="f_school_id" value="${auth.user.school_id || ''}" required /></div>
        <div class="field"><label>${t('students.guardian_name','Guardian Name')}</label><input id="f_guardian_name" /></div>
        <div class="field" style="grid-column: span 2"><label>${t('students.guardian_contact','Guardian Contact')}</label><input id="f_guardian_contact" /></div>
      </div>
      <button class="btn btn-primary" type="submit">${t('common.save','Save')}</button>
    </form>`);
}

async function submitAddStudent(e) {
  e.preventDefault();
  const payload = {
    student_id: document.getElementById('f_student_id').value,
    full_name: document.getElementById('f_full_name').value,
    date_of_birth: document.getElementById('f_dob').value,
    gender: document.getElementById('f_gender').value,
    class_name: document.getElementById('f_class').value,
    school_year: parseInt(document.getElementById('f_year').value),
    school_id: parseInt(document.getElementById('f_school_id').value),
    guardian_name: document.getElementById('f_guardian_name').value || null,
    guardian_contact: document.getElementById('f_guardian_contact').value || null,
  };
  const res = await apiFetch('/students/', { method: 'POST', body: JSON.stringify(payload) });
  if (res.ok) { closeModal(); navigate('students'); } else { alert((await res.json()).detail); }
  return false;
}

async function renderStudentDetail() {
  const res = await apiFetch(`/students/${S.studentId}`);
  const content = document.getElementById('content');
  if (!res.ok) { content.innerHTML = await errorHtml(res); return; }
  const s = await res.json();
  const [attRes, behRes] = await Promise.all([
    apiFetch(`/students/${S.studentId}/attendance`),
    apiFetch(`/students/${S.studentId}/behavior`),
  ]);
  const attendance = attRes.ok ? await attRes.json() : [];
  const behavior = behRes.ok ? await behRes.json() : [];
  
  // Calculate attendance percentage
  const attendancePercentage = attendance.length > 0 
    ? Math.round((attendance.filter(a => a.status === 'present').length / attendance.length) * 100)
    : 0;
  
  content.innerHTML = `
    <h1 class="page-title">${s.full_name} <span class="muted">(${s.student_id})</span></h1>
    <div class="grid">
      <div class="card"><b>${t('students.class_name','Class')}:</b> ${s.class_name}<br/><b>${t('students.school_year','Year')}:</b> ${s.school_year}<br/><b>Gender:</b> ${s.gender}</div>
      <div class="card"><b>${t('students.guardian_name','Guardian')}:</b> ${s.guardian_name || '-'}<br/><b>${t('students.guardian_contact','Contact')}:</b> ${s.guardian_contact || '-'}</div>
    </div>
    <div class="card">
      <h3>Attendance (recent)</h3>
      <table><thead><tr><th>Date</th><th>Attendance percentage</th><th>Reason</th></tr></thead>
      <tbody>${attendance.slice(0,10).map(a => `<tr><td>${a.record_date}</td><td>${attendancePercentage}%</td><td>${a.reason||'-'}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No records.</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <h3>Behavior (recent)</h3>
      <table><thead><tr><th>Date</th><th>Type</th><th>Description</th></tr></thead>
      <tbody>${behavior.slice(0,10).map(b => `<tr><td>${b.incident_date}</td><td>${b.incident_type}</td><td>${b.description}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No records.</td></tr>'}</tbody></table>
    </div>
    <button class="btn btn-outline" onclick="navigate('students')">← Back to Students</button>`;
}

// ── Early Detection (Agent 1) ──
async function renderEarlyDetection() {
  const content = document.getElementById('content');
  const students = await (await apiFetch('/students/')).json();
  content.innerHTML = `
    <h1 class="page-title">${t('nav.early_detection', 'Early Detection')}</h1>
    <div class="card">
      <div class="field"><label>Student</label>
        <select id="ed_student">${students.map(s => `<option value="${s.student_id}">${s.full_name} (${s.student_id})</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" onclick="runRiskAssessment()">${t('nav.invoke_agent1', 'Run Agent 1: Risk Detection')}</button>
      <a href="/static/forms/saringan_minda_sihat.html" target="_blank" class="btn btn-outline" style="margin-left:8px; display:inline-block">SMS Form</a>
      <a href="/static/forms/nichq_vanderbilt.html" target="_blank" class="btn btn-outline" style="margin-left:8px; display:inline-block">NICHQ Form</a>
    </div>
    <div id="ed_result"></div>`;
}

async function runRiskAssessment() {
  const studentId = document.getElementById('ed_student').value;
  const resultDiv = document.getElementById('ed_result');
  resultDiv.innerHTML = '<p class="muted">' + t('common.loading','Loading...') + '</p>';
  const res = await apiFetch(`/risk/${studentId}/assess?language=${currentLang()}`);
  if (!res.ok) { resultDiv.innerHTML = await errorHtml(res); return; }
  const r = await res.json();
  resultDiv.innerHTML = `
    <div class="card">
      <h3>${r.student_name} — <span class="badge ${riskBadgeClass(r.risk_level)}">${r.risk_level}</span> (${r.risk_score}/100)</h3>
      <p>${r.summary}</p>
      <h4>Risk Factors</h4>
      <table><thead><tr><th>Category</th><th>Indicator</th><th>Severity</th><th>Evidence</th></tr></thead>
      <tbody>${r.risk_factors.map(f => `<tr><td>${f.category}</td><td>${f.indicator}</td><td>${f.severity}</td><td>${f.evidence}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">None flagged.</td></tr>'}</tbody></table>
      <h4>Recommended Actions</h4><ul>${r.recommended_actions.map(a => `<li>${a}</li>`).join('')}</ul>
      <div class="disclaimer">${r.disclaimer}</div>
    </div>`;
}

// ── Intervention (Agent 2) ──
async function renderIntervention() {
  const content = document.getElementById('content');
  const students = await (await apiFetch('/students/')).json();
  content.innerHTML = `
    <h1 class="page-title">${t('nav.intervention', 'Intervention')}</h1>
    <div class="card">
      <div class="field"><label>Student</label>
        <select id="iv_student">${students.map(s => `<option value="${s.student_id}">${s.full_name} (${s.student_id})</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" onclick="runIntervention()">Run Agent 2: Intervention Plan</button>
    </div>
    <div id="iv_result"></div>`;
}

async function runIntervention() {
  const studentId = document.getElementById('iv_student').value;
  const resultDiv = document.getElementById('iv_result');
  resultDiv.innerHTML = '<p class="muted">' + t('common.loading','Loading...') + '</p>';
  const params = new URLSearchParams({ school_name: auth.user.school_name || '', prepared_by: auth.user.name, language: currentLang() });
  const res = await apiFetch(`/risk/${studentId}/intervene?${params}`);
  if (!res.ok) { resultDiv.innerHTML = await errorHtml(res); return; }
  const p = await res.json();
  resultDiv.innerHTML = `
    <div class="card">
      <h3>${p.student_name} — <span class="badge ${riskBadgeClass(p.risk_level)}">${p.risk_level}</span></h3>
      <p class="muted">Case: ${p.case_reference} · ${p.date} · Prepared by ${p.prepared_by}</p>
      <h4>Reason for Intervention</h4><ul>${p.reason_for_intervention.map(r => `<li>${r}</li>`).join('')}</ul>
      <h4>Strategies</h4>
      <table><thead><tr><th>Area</th><th>Strategy</th><th>Responsible</th><th>Frequency</th></tr></thead>
      <tbody>${p.strategies.map(s => `<tr><td>${s.area}</td><td>${s.strategy}</td><td>${s.responsible}</td><td>${s.frequency}</td></tr>`).join('')}</tbody></table>
      <h4>Counselor Recommendation</h4><p>${p.counselor_recommendation}</p>
      ${p.referral_recommended ? `<p style="color:#dc2626"><b>⚠ Referral recommended:</b> ${p.referral_reason || ''}</p>` : ''}
      <a class="btn btn-outline" href="/risk/interventions/${p.intervention_id}/report?language=${currentLang()}" target="_blank">Download .docx Report</a>
      <div class="disclaimer">${p.disclaimer}</div>
    </div>`;
}

// ── Referral (Agent 3) ──
async function renderReferral() {
  const content = document.getElementById('content');
  const students = await (await apiFetch('/students/')).json();
  content.innerHTML = `
    <h1 class="page-title">${t('nav.referral', 'Referral')}</h1>
    <div class="card">
      <div class="form-grid">
        <div class="field"><label>Student</label>
          <select id="rf_student">${students.map(s => `<option value="${s.student_id}">${s.full_name} (${s.student_id})</option>`).join('')}</select>
        </div>
        <div class="field"><label>Referral Type</label>
          <select id="rf_type"><option value="psychologist">Psychologist</option><option value="psychiatrist">Psychiatrist</option><option value="healthcare">Healthcare Provider</option><option value="kementerian">Kementerian Kesihatan</option></select>
        </div>
        <div class="field"><label>Referral To</label><input id="rf_to" placeholder="e.g. Klinik Kesihatan Sentul" /></div>
        <div class="field" style="grid-column: span 2"><label>Additional Notes</label><textarea id="rf_notes" rows="2"></textarea></div>
      </div>
      <button class="btn btn-primary" onclick="runReferral()">Run Agent 3: Generate Referral</button>
    </div>
    <div id="rf_result"></div>`;
}

async function runReferral() {
  const resultDiv = document.getElementById('rf_result');
  resultDiv.innerHTML = '<p class="muted">' + t('common.loading','Loading...') + '</p>';
  const payload = {
    student_id: document.getElementById('rf_student').value,
    referral_type: document.getElementById('rf_type').value,
    referral_to: document.getElementById('rf_to').value,
    prepared_by: auth.user.name,
    additional_notes: document.getElementById('rf_notes').value,
  };
  const res = await apiFetch('/referrals/generate', { method: 'POST', body: JSON.stringify(payload) });
  if (!res.ok) { resultDiv.innerHTML = await errorHtml(res); return; }
  const doc = await res.json();
  resultDiv.innerHTML = `
    <div class="card">
      <h3>Referral Letter — ${doc.student_name}</h3>
      <p style="white-space: pre-wrap">${doc.letter_content}</p>
      <h4>Supporting Summary</h4>
      <p>${doc.supporting_summary}</p>
      <div class="disclaimer">${doc.disclaimer}</div>
    </div>`;
}

// ── Assessments ──
async function renderAssessments() {
  const res = await apiFetch('/assessments/');
  const content = document.getElementById('content');
  if (!res.ok) { content.innerHTML = await errorHtml(res); return; }
  const assessments = await res.json();
  content.innerHTML = `
    <h1 class="page-title">${t('nav.assessments', 'Assessment Instruments')}</h1>
    <div class="card">
      <table><thead><tr><th>Name</th><th>Type</th><th>Description</th></tr></thead>
      <tbody>${assessments.map(a => `<tr><td>${a.name}</td><td>${a.instrument_type}</td><td>${a.description||'-'}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">None seeded yet.</td></tr>'}</tbody></table>
    </div>`;
}

// ── Class Summary ──
async function renderClassSummary() {
  const res = await apiFetch('/reports/class-summary');
  const content = document.getElementById('content');
  if (!res.ok) { content.innerHTML = await errorHtml(res); return; }
  const rows = await res.json();
  content.innerHTML = `
    <h1 class="page-title">${t('nav.class_summary', 'Class Summary')}</h1>
    <div class="card">
      <table><thead><tr><th>Class</th><th>Total</th><th>${t('risk.low','Low')}</th><th>${t('risk.moderate','Moderate')}</th><th>${t('risk.high','High')}</th></tr></thead>
      <tbody>${rows.map(c => `<tr><td>${c.class_name}</td><td>${c.total_students}</td><td>${c.low_risk}</td><td>${c.moderate_risk}</td><td>${c.high_risk}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No data yet.</td></tr>'}</tbody></table>
    </div>`;
}

async function errorHtml(res) {
  const body = await res.json().catch(() => ({ detail: res.statusText }));
  return `<div class="card" style="color:#dc2626">${body.detail || 'Request failed.'}</div>`;
}

document.getElementById('userInfo').textContent = `${auth.user.name} · ${auth.user.role}`;
loadLanguages().then(() => navigate('dashboard'));
</script>
</body>
</html>
