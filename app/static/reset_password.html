<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tetapkan Semula Kata Laluan — Student Well-Being</title>
<style>
  :root { --blue: #1a3aad; --blue-dark: #1e3a8a; --teal: #0d9488; --bg: #f1f5f9; --border: #e2e8f0; --text: #1e293b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--blue), #2563eb 45%, var(--teal)); }
  .card { background: #fff; border-radius: 16px; padding: 36px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .logo-badge { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 800; margin: 0 auto 16px; }
  h2 { text-align: center; color: var(--blue-dark); margin: 0 0 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .btn { width: 100%; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--teal); color: #fff; }
  .msg { border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 14px; }
  .msg.error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
  .msg.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-badge">KPM</div>
  <h2>Tetapkan Semula Kata Laluan</h2>
  <div id="invalidLink" class="msg error" style="display:none">Pautan tidak sah atau telah tamat tempoh.</div>
  <form id="resetForm" style="display:none" onsubmit="return handleReset(event)">
    <div id="feedback"></div>
    <div class="field">
      <label>Kata Laluan Baharu</label>
      <input type="password" id="newPassword" minlength="8" required />
    </div>
    <div class="field">
      <label>Sahkan Kata Laluan</label>
      <input type="password" id="confirmPassword" minlength="8" required />
    </div>
    <button class="btn" type="submit">Tetapkan Semula</button>
  </form>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) {
    document.getElementById('invalidLink').style.display = 'block';
  } else {
    document.getElementById('resetForm').style.display = 'block';
  }

  async function handleReset(e) {
    e.preventDefault();
    const feedback = document.getElementById('feedback');
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) {
      feedback.innerHTML = '<div class="msg error">Kata laluan tidak sepadan.</div>';
      return false;
    }
    const res = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: newPassword }),
    });
    const body = await res.json();
    if (res.ok) {
      feedback.innerHTML = `<div class="msg success">${body.message}</div>`;
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      feedback.innerHTML = `<div class="msg error">${body.detail}</div>`;
    }
    return false;
  }
</script>
</body>
</html>
